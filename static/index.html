<!doctype html>
<html lang="zh-CN" data-theme="olive-sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="上传音频并使用 WhisperX 转换为带时间轴的文字结果。"
    />
    <meta name="theme-color" content="#6E8165" />
    <title>Audio to Text</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      [data-theme="olive-sage"] {
        color-scheme: light;
        --color-base-100: oklch(99.2% 0.006 110);
        --color-base-200: oklch(97.2% 0.01 110);
        --color-base-300: oklch(92.8% 0.016 112);
        --color-base-content: oklch(27% 0.018 115);
        --color-primary: oklch(58% 0.048 136);
        --color-primary-content: oklch(99% 0.003 110);
        --color-secondary: oklch(69% 0.034 112);
        --color-secondary-content: oklch(99% 0.003 110);
        --color-accent: oklch(84% 0.032 88);
        --color-accent-content: oklch(28% 0.02 88);
        --color-neutral: oklch(39% 0.024 116);
        --color-neutral-content: oklch(98% 0.003 110);
        --color-info: oklch(73% 0.048 225);
        --color-info-content: oklch(99% 0.003 225);
        --color-success: oklch(74% 0.05 145);
        --color-success-content: oklch(99% 0.003 145);
        --color-warning: oklch(84% 0.042 95);
        --color-warning-content: oklch(28% 0.022 90);
        --color-error: oklch(67% 0.07 25);
        --color-error-content: oklch(99% 0.003 25);
        --radius-selector: 0rem;
        --radius-field: 0rem;
        --radius-box: 0rem;
        --size-selector: 0.28125rem;
        --size-field: 0.28125rem;
        --border: 2px;
        --depth: 0;
        --noise: 0;
      }
    </style>
  </head>
  <body>
    <button class="btn btn-primary">
      Hello
    </button>
  </body>
</html>
