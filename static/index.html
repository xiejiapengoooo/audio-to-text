<!doctype html>
<html lang="en" data-theme="olive-sage">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F6F6EF" />
    <title>Audio to Text</title>
    <link
      href="./main.css"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="text-base-content">
    <main class="app-shell min-h-screen">
      <div class="workspace-grid">
        <section class="card upload-card border border-base-300 bg-base-100" aria-labelledby="upload-title">
          <div class="card-body gap-5 p-5 sm:p-6">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h2 class="card-title text-xl tracking-tight" id="upload-title">Upload Audio</h2>
                <p class="mt-1 text-sm leading-6 text-base-content/55">Select a file to start transcribing</p>
              </div>
            </div>

            <label
              class="upload-dropzone"
              id="dropZone"
              for="audioInput"
              role="button"
              tabindex="0"
            >
              <input
                id="audioInput"
                type="file"
                accept="audio/*,.aac,.flac,.m4a,.mp3,.ogg,.opus,.wav"
                hidden
              />
              <span>
                <span class="upload-icon" aria-hidden="true">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
                <strong class="mb-2 block text-base">Drop audio here</strong>
                <span class="block text-sm leading-6 text-base-content/50">or click to browse your files</span>
              </span>
            </label>

            <div class="selected-file-panel p-4" id="selectedFile" hidden>
              <div class="flex min-w-0 items-center gap-3">
                <span class="grid size-11 flex-none place-items-center bg-primary/10 text-primary" aria-hidden="true">
                  <svg width="21" height="21" viewBox="0 0 24 24" fill="none">
                    <path d="M9 18V5l10-2v13M9 9l10-2M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm10-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                  </svg>
                </span>
                <div class="file-copy flex-1">
                  <div class="truncate-line text-sm font-semibold" id="selectedFileName"></div>
                  <p class="mt-1 mb-0 text-xs text-base-content/50" id="selectedFileMeta"></p>
                </div>
                <button class="btn btn-ghost btn-sm btn-square" id="removeFileButton" type="button" aria-label="Remove selected file">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  </svg>
                </button>
              </div>
              <audio class="audio-preview mt-4" id="audioPreview" controls preload="metadata"></audio>
            </div>

            <div id="uploadProgress" hidden>
              <div class="mb-2 flex items-center justify-between text-xs text-base-content/55">
                <span id="progressLabel">Uploading</span>
                <span class="font-medium tabular-nums" id="progressValue">0%</span>
              </div>
              <progress
                class="progress progress-primary w-full"
                id="progressBar"
                value="0"
                max="100"
                aria-label="Upload progress"
              ></progress>
            </div>

            <button class="btn btn-primary btn-block" id="uploadButton" type="button">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
              </svg>
              <span id="uploadButtonLabel">Choose Audio File</span>
            </button>

            <div class="flex gap-2 bg-base-200 p-3 text-xs leading-5 text-base-content/55">
              <svg class="mt-0.5 flex-none text-primary" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" />
                <path d="M12 11v5m0-8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              </svg>
              <span>Supports AAC, FLAC, M4A, MP3, OGG, OPUS, and WAV.</span>
            </div>
          </div>
        </section>

        <section class="min-w-0" aria-label="Transcription tasks and files">
          <div class="metric-grid mb-5" aria-label="Transcription overview">
            <button
              class="metric-card metric-button p-4"
              id="connectionButton"
              type="button"
              data-status="connecting"
              title="Click to reconnect"
            >
              <div class="metric-label mb-2 flex items-center gap-2 text-base-content/50">
                <span class="connection-dot" aria-hidden="true"></span>
                Service Status
              </div>
              <div class="metric-value tracking-tight" id="serviceMetric">Connecting</div>
              <span class="sr-only" id="connectionLabel">Connecting to service</span>
            </button>
            <div class="metric-card p-4">
              <div class="metric-label mb-2 text-base-content/50">Pending Tasks</div>
              <div class="metric-value text-xl tracking-tight" id="queueMetric">—</div>
            </div>
            <div class="metric-card p-4">
              <div class="metric-label mb-2 text-base-content/50">Completed Files</div>
              <div class="metric-value text-xl tracking-tight" id="resultMetric">—</div>
            </div>
          </div>

          <div class="grid gap-5">
            <section class="content-panel" aria-labelledby="queue-title">
              <div class="panel-header">
                <div class="flex items-center gap-2">
                  <h3 class="font-semibold tracking-tight" id="queue-title">Pending Tasks</h3>
                  <span class="badge badge-primary badge-sm" id="queueCount">0</span>
                </div>
                <span class="text-xs text-base-content/45">Processed in submission order</span>
              </div>
              <div class="panel-body-note" id="queueNote">Loading task status…</div>
              <div id="queueContent" aria-live="polite"></div>
            </section>

            <section class="content-panel" aria-labelledby="results-title">
              <div class="panel-header">
                <div class="flex items-center gap-2">
                  <h3 class="font-semibold tracking-tight" id="results-title">Completed Files</h3>
                  <span class="badge badge-primary badge-sm" id="resultCount">0</span>
                </div>
              </div>
              <div id="resultsContent" aria-live="polite"></div>
            </section>
          </div>
        </section>
      </div>
    </main>

    <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

    <dialog class="modal" id="resultDialog" aria-labelledby="dialogTitle">
      <div class="modal-box result-dialog bg-base-100">
        <div class="dialog-layout">
          <div class="border-b border-base-300 px-5 py-5 sm:px-6">
            <div class="flex min-w-0 items-center gap-4">
              <h2 class="truncate-line min-w-0 flex-1 text-lg font-semibold tracking-tight" id="dialogTitle">Transcription Result</h2>
              <button class="btn btn-ghost btn-sm btn-square flex-none" id="closeDialogButton" type="button" aria-label="Close result preview">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
              </button>
            </div>
            <p class="mt-1 mb-0 text-xs text-base-content/50" id="dialogMeta"></p>
          </div>

          <div class="dialog-body p-5 sm:p-6" id="dialogBody"></div>

          <div class="flex flex-wrap justify-end gap-2 border-t border-base-300 bg-base-200/70 px-5 py-4 sm:px-6">
            <button class="btn btn-outline btn-sm" id="copyResultButton" type="button" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.8" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="1.8" />
              </svg>
              Copy Text
            </button>
            <a class="btn btn-primary btn-sm" id="downloadResultLink" href="#" download>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 4v11m0 0 4-4m-4 4-4-4M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Download File
            </a>
          </div>
        </div>
      </div>
      <form method="dialog" class="modal-backdrop">
        <button aria-label="Close result preview">Close</button>
      </form>
    </dialog>

    <script>
      (() => {
        "use strict";

        const SESSION_KEY = "session_id";
        const POLL_INTERVAL = 5000;
        const DEFAULT_MODEL = "whisperx";
        const API = {
          session: "/session",
          currentTask: "/task",
          tasks: "/tasks",
          results: "/results",
        };
        const AUDIO_MIME_TYPES = {
          ".aac": "audio/aac",
          ".flac": "audio/flac",
          ".m4a": "audio/mp4",
          ".mp3": "audio/mpeg",
          ".ogg": "audio/ogg",
          ".opus": "audio/opus",
          ".wav": "audio/wav",
        };
        const ICONS = {
          clock: "M12 7v5l3 2m6-2a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z",
          file: "M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2ZM14 2v6h6",
          preview: "M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12Zm9.5 2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z",
          download: "M12 4v11m0 0 4-4m-4 4-4-4M5 19h14",
          warning: "M12 9v4m0 4h.01M10.3 4.3 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0Z",
        };
        const CONNECTION_COPY = {
          connecting: { label: "Connecting to service", metric: "Connecting" },
          online: { label: "Service online", metric: "Operational" },
          offline: { label: "Connection failed", metric: "Offline" },
        };
        const DATE_FORMATTER = new Intl.DateTimeFormat("en-US", {
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });

        const state = {
          sessionId: "",
          sessionPromise: null,
          refreshPromise: null,
          pollTimer: null,
          selectedFile: null,
          selectedFileUrl: "",
          previewText: "",
          previewController: null,
          isUploading: false,
          isReconnecting: false,
          currentTask: null,
          tasks: [],
          results: [],
        };

        const byId = (id) => document.getElementById(id);
        const elements = {
          connectionButton: byId("connectionButton"),
          connectionLabel: byId("connectionLabel"),
          serviceMetric: byId("serviceMetric"),
          queueMetric: byId("queueMetric"),
          resultMetric: byId("resultMetric"),
          dropZone: byId("dropZone"),
          audioInput: byId("audioInput"),
          selectedFile: byId("selectedFile"),
          selectedFileName: byId("selectedFileName"),
          selectedFileMeta: byId("selectedFileMeta"),
          removeFileButton: byId("removeFileButton"),
          audioPreview: byId("audioPreview"),
          uploadProgress: byId("uploadProgress"),
          progressLabel: byId("progressLabel"),
          progressValue: byId("progressValue"),
          progressBar: byId("progressBar"),
          uploadButton: byId("uploadButton"),
          uploadButtonLabel: byId("uploadButtonLabel"),
          queueCount: byId("queueCount"),
          queueNote: byId("queueNote"),
          resultCount: byId("resultCount"),
          queueContent: byId("queueContent"),
          resultsContent: byId("resultsContent"),
          toastRegion: byId("toastRegion"),
          resultDialog: byId("resultDialog"),
          dialogTitle: byId("dialogTitle"),
          dialogMeta: byId("dialogMeta"),
          dialogBody: byId("dialogBody"),
          closeDialogButton: byId("closeDialogButton"),
          copyResultButton: byId("copyResultButton"),
          downloadResultLink: byId("downloadResultLink"),
        };

        function getStoredSession() {
          try {
            return window.localStorage.getItem(SESSION_KEY) || "";
          } catch {
            return "";
          }
        }

        function storeSession(sessionId) {
          try {
            window.localStorage.setItem(SESSION_KEY, sessionId);
          } catch {
            // localStorage may be unavailable in private browsing mode.
          }
        }

        function createRequestError(message, status = 0) {
          const error = new Error(message);
          error.status = status;
          return error;
        }

        function getErrorMessage(error, fallback) {
          return error instanceof Error && error.message ? error.message : fallback;
        }

        async function readError(response) {
          try {
            const body = await response.json();
            if (typeof body.detail === "string") {
              return body.detail;
            }
            if (Array.isArray(body.detail)) {
              const messages = body.detail
                .map((item) => (typeof item?.msg === "string" ? item.msg : ""))
                .filter(Boolean);
              if (messages.length) {
                return messages.join("; ");
              }
            }
          } catch {
            // Fall back to the status code for non-JSON error responses.
          }
          return `Request failed (${response.status})`;
        }

        function setConnectionStatus(status) {
          const copy = CONNECTION_COPY[status];
          elements.connectionButton.dataset.status = status;
          elements.connectionLabel.textContent = copy.label;
          elements.serviceMetric.textContent = copy.metric;
        }

        function resetDashboardData() {
          state.currentTask = null;
          state.tasks = [];
          state.results = [];
        }

        function invalidateSession(sessionId = state.sessionId) {
          if (state.sessionId && sessionId && state.sessionId !== sessionId) {
            return;
          }
          state.sessionId = "";
          setConnectionStatus("connecting");
          updateControls();
        }

        async function createSession() {
          const previousSession = getStoredSession();
          const response = await fetch(API.session, {
            method: "POST",
            headers: previousSession ? { session: previousSession } : {},
            cache: "no-store",
          });

          if (!response.ok) {
            throw createRequestError(await readError(response), response.status);
          }

          const sessionId = await response.json();
          if (typeof sessionId !== "string" || !sessionId) {
            throw createRequestError("The service returned an invalid session", response.status);
          }

          if (previousSession && previousSession !== sessionId) {
            resetDashboardData();
          }
          state.sessionId = sessionId;
          storeSession(sessionId);
          setConnectionStatus("online");
          updateControls();
          return sessionId;
        }

        async function ensureSession() {
          if (state.sessionId) {
            return state.sessionId;
          }
          if (state.sessionPromise) {
            return state.sessionPromise;
          }

          const sessionPromise = createSession();
          state.sessionPromise = sessionPromise;
          try {
            return await sessionPromise;
          } finally {
            if (state.sessionPromise === sessionPromise) {
              state.sessionPromise = null;
            }
          }
        }

        async function requestJson(path, options = {}, allowSessionRetry = true) {
          const sessionId = await ensureSession();
          const headers = new Headers(options.headers || {});
          headers.set("session", sessionId);

          const response = await fetch(path, {
            ...options,
            headers,
            cache: "no-store",
          });

          if (response.status === 404 && allowSessionRetry) {
            invalidateSession(sessionId);
            await ensureSession();
            return requestJson(path, options, false);
          }
          if (!response.ok) {
            throw createRequestError(await readError(response), response.status);
          }
          if (response.status === 204) {
            return null;
          }
          return response.json();
        }

        function getExtension(filename) {
          const lastDot = filename.lastIndexOf(".");
          return lastDot >= 0 ? filename.slice(lastDot).toLowerCase() : "";
        }

        function displayFilename(filename) {
          const prefix = state.sessionId ? `${state.sessionId}_` : "";
          return prefix && filename.startsWith(prefix)
            ? filename.slice(prefix.length)
            : filename;
        }

        function formatBytes(bytes) {
          const value = Number(bytes);
          if (!Number.isFinite(value) || value <= 0) {
            return "0 B";
          }

          const units = ["B", "KB", "MB", "GB"];
          const unitIndex = Math.min(
            Math.floor(Math.log(value) / Math.log(1024)),
            units.length - 1,
          );
          const amount = value / 1024 ** unitIndex;
          const digits = unitIndex === 0 || amount >= 100 ? 0 : 1;
          return `${amount.toFixed(digits)} ${units[unitIndex]}`;
        }

        function formatDate(timestampSeconds) {
          const date = new Date(Number(timestampSeconds) * 1000);
          return Number.isNaN(date.getTime()) ? "Unknown date" : DATE_FORMATTER.format(date);
        }

        function formatTime(seconds) {
          const value = Math.max(0, Number(seconds) || 0);
          const hours = Math.floor(value / 3600);
          const minutes = Math.floor((value % 3600) / 60);
          const remainingSeconds = Math.floor(value % 60);
          const minutesAndSeconds = `${String(minutes).padStart(2, "0")}:${String(remainingSeconds).padStart(2, "0")}`;
          return hours
            ? `${String(hours).padStart(2, "0")}:${minutesAndSeconds}`
            : minutesAndSeconds;
        }

        function createIcon(path, size = 17) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("width", String(size));
          svg.setAttribute("height", String(size));
          svg.setAttribute("viewBox", "0 0 24 24");
          svg.setAttribute("fill", "none");
          svg.setAttribute("aria-hidden", "true");

          const pathElement = document.createElementNS("http://www.w3.org/2000/svg", "path");
          pathElement.setAttribute("d", path);
          pathElement.setAttribute("stroke", "currentColor");
          pathElement.setAttribute("stroke-width", "1.9");
          pathElement.setAttribute("stroke-linecap", "round");
          pathElement.setAttribute("stroke-linejoin", "round");
          svg.append(pathElement);
          return svg;
        }

        function showToast(message, type = "success") {
          const toast = document.createElement("div");
          toast.className = `alert app-toast items-start shadow-lg ${type === "error" ? "alert-error" : "alert-success"}`;

          const icon = document.createElement("span");
          icon.className = "grid size-6 flex-none place-items-center bg-current/15 text-sm font-bold";
          icon.textContent = type === "error" ? "!" : "✓";

          const copy = document.createElement("span");
          copy.className = "text-sm leading-6";
          copy.textContent = message;

          toast.append(icon, copy);
          elements.toastRegion.append(toast);
          requestAnimationFrame(() => toast.classList.add("is-visible"));

          window.setTimeout(() => {
            toast.classList.remove("is-visible");
            window.setTimeout(() => toast.remove(), 200);
          }, 3600);
        }

        function renderSkeleton(container, rows) {
          container.replaceChildren();
          for (let index = 0; index < rows; index += 1) {
            const row = document.createElement("div");
            row.className = "skeleton-row";

            const icon = document.createElement("span");
            icon.className = "skeleton size-11 flex-none";

            const copy = document.createElement("span");
            copy.className = "skeleton-copy";

            const name = document.createElement("span");
            name.className = "skeleton mb-2 block h-3 w-2/3";

            const meta = document.createElement("span");
            meta.className = "skeleton block h-2 w-1/3";

            copy.append(name, meta);
            row.append(icon, copy);
            container.append(row);
          }
        }

        function createEmptyState(title, description, iconPath) {
          const wrapper = document.createElement("div");
          wrapper.className = "empty-state";

          const content = document.createElement("div");
          const icon = document.createElement("span");
          icon.className = "empty-icon";
          icon.append(createIcon(iconPath, 24));

          const heading = document.createElement("strong");
          heading.className = "mb-1 block text-sm text-base-content/75";
          heading.textContent = title;

          const copy = document.createElement("p");
          copy.className = "mx-auto mb-0 max-w-xs text-xs leading-6";
          copy.textContent = description;

          content.append(icon, heading, copy);
          wrapper.append(content);
          return wrapper;
        }

        function createTaskIcon(isProcessing) {
          const icon = document.createElement("span");
          icon.className = `data-icon${isProcessing ? " is-processing" : ""}`;

          if (isProcessing) {
            const bars = document.createElement("span");
            bars.className = "processing-bars flex items-center";
            for (let index = 0; index < 4; index += 1) {
              bars.append(document.createElement("span"));
            }
            icon.append(bars);
          } else {
            icon.append(createIcon(ICONS.clock, 21));
          }
          return icon;
        }

        function renderTasks() {
          const entries = [];
          if (state.currentTask) {
            entries.push({ task: state.currentTask, isProcessing: true });
          }
          entries.push(...state.tasks.map((task) => ({ task, isProcessing: false })));

          elements.queueCount.textContent = String(entries.length);
          elements.queueMetric.textContent = String(entries.length);
          if (state.currentTask) {
            elements.queueNote.textContent = state.tasks.length
              ? `Processing 1 task, with ${state.tasks.length} more waiting.`
              : "Processing 1 task.";
          } else if (state.tasks.length) {
            elements.queueNote.textContent = `${state.tasks.length} ${state.tasks.length === 1 ? "task is" : "tasks are"} waiting to be processed.`;
          } else {
            elements.queueNote.textContent = "Submitted audio will appear here while it waits to be processed.";
          }

          elements.queueContent.replaceChildren();
          if (!entries.length) {
            elements.queueContent.append(
              createEmptyState(
                "No pending tasks",
                "Upload audio to track its processing status here.",
                ICONS.clock,
              ),
            );
            return;
          }

          const list = document.createElement("ul");
          list.className = "data-list";
          entries.forEach(({ task, isProcessing }) => {
            const row = document.createElement("li");
            row.className = "data-row";

            const copy = document.createElement("div");
            copy.className = "data-copy";

            const name = document.createElement("div");
            name.className = "truncate-line text-sm font-semibold";
            name.textContent = displayFilename(task.filename || "Untitled audio");
            name.title = name.textContent;

            const meta = document.createElement("p");
            meta.className = "mt-1 mb-0 text-xs text-base-content/45";
            meta.textContent = `${task.model || DEFAULT_MODEL} · ${isProcessing ? task.status_message || "Transcribing and aligning" : "Waiting"}`;

            const status = document.createElement("span");
            status.className = `badge badge-sm flex-none ${isProcessing ? "badge-warning" : "badge-ghost"}`;
            status.textContent = isProcessing ? "Processing" : "Queued";

            copy.append(name, meta);
            row.append(createTaskIcon(isProcessing), copy, status);
            list.append(row);
          });
          elements.queueContent.append(list);
        }

        function renderResults() {
          elements.resultCount.textContent = String(state.results.length);
          elements.resultMetric.textContent = String(state.results.length);
          elements.resultsContent.replaceChildren();

          if (!state.results.length) {
            elements.resultsContent.append(
              createEmptyState(
                "No completed files",
                "Completed transcriptions will appear here for viewing and download.",
                ICONS.file,
              ),
            );
            return;
          }

          const list = document.createElement("ul");
          list.className = "data-list";
          state.results.forEach((result) => {
            const visibleName = displayFilename(result.name || "result.json");
            const row = document.createElement("li");
            row.className = "data-row result-row";

            const type = document.createElement("span");
            type.className = "data-icon";
            type.append(createIcon(ICONS.file, 21));

            const copy = document.createElement("div");
            copy.className = "data-copy";

            const name = document.createElement("div");
            name.className = "truncate-line text-sm font-semibold";
            name.textContent = visibleName;
            name.title = visibleName;

            const meta = document.createElement("p");
            meta.className = "mt-1 mb-0 text-xs text-base-content/45";
            meta.textContent = `${formatBytes(result.size)} · ${formatDate(result.modified_at)}`;
            copy.append(name, meta);

            const actions = document.createElement("div");
            actions.className = "data-actions";

            const previewButton = document.createElement("button");
            previewButton.className = "btn btn-ghost btn-sm";
            previewButton.type = "button";
            previewButton.setAttribute("aria-label", `View ${visibleName}`);
            previewButton.append(
              createIcon(ICONS.preview, 16),
              document.createTextNode("View"),
            );
            previewButton.addEventListener("click", () => {
              void openResult(result);
            });

            const downloadLink = document.createElement("a");
            downloadLink.className = "btn btn-ghost btn-sm";
            downloadLink.href = result.url;
            downloadLink.download = visibleName;
            downloadLink.setAttribute("aria-label", `Download ${visibleName}`);
            downloadLink.append(
              createIcon(ICONS.download, 16),
              document.createTextNode("Download"),
            );

            actions.append(previewButton, downloadLink);
            row.append(type, copy, actions);
            list.append(row);
          });
          elements.resultsContent.append(list);
        }

        const dashboardResources = [
          {
            key: "currentTask",
            path: API.currentTask,
            normalize: (value) => value || null,
          },
          {
            key: "tasks",
            path: API.tasks,
            normalize: (value) => (Array.isArray(value) ? value : []),
          },
          {
            key: "results",
            path: API.results,
            normalize: (value) => (Array.isArray(value) ? value : []),
          },
        ];

        async function loadDashboard({ notify = false, reportError = false } = {}) {
          const responses = await Promise.allSettled(
            dashboardResources.map((resource) => requestJson(resource.path)),
          );
          const errors = [];
          let successCount = 0;

          responses.forEach((response, index) => {
            const resource = dashboardResources[index];
            if (response.status === "fulfilled") {
              state[resource.key] = resource.normalize(response.value);
              successCount += 1;
            } else {
              errors.push(response.reason);
            }
          });

          renderTasks();
          renderResults();

          if (successCount) {
            setConnectionStatus("online");
            if (notify) {
              showToast("Tasks and files updated");
            }
            return;
          }

          setConnectionStatus("offline");
          if (reportError) {
            showToast(
              getErrorMessage(errors[0], "Unable to load task data"),
              "error",
            );
          }
        }

        function clearPollingTimer() {
          if (state.pollTimer !== null) {
            window.clearTimeout(state.pollTimer);
            state.pollTimer = null;
          }
        }

        function schedulePolling() {
          clearPollingTimer();
          if (document.hidden || (!state.currentTask && !state.tasks.length)) {
            return;
          }

          state.pollTimer = window.setTimeout(() => {
            state.pollTimer = null;
            void refreshData();
          }, POLL_INTERVAL);
        }

        async function refreshData(options = {}) {
          if (state.refreshPromise) {
            return state.refreshPromise;
          }

          const refreshPromise = loadDashboard(options);
          state.refreshPromise = refreshPromise;
          try {
            return await refreshPromise;
          } finally {
            if (state.refreshPromise === refreshPromise) {
              state.refreshPromise = null;
              schedulePolling();
            }
          }
        }

        async function refreshAfterCurrentRequest(options = {}) {
          const currentRefresh = state.refreshPromise;
          if (currentRefresh) {
            try {
              await currentRefresh;
            } catch {
              // The next refresh will retrieve the complete state.
            }
          }
          return refreshData(options);
        }

        function releaseSelectedFileUrl() {
          if (state.selectedFileUrl) {
            URL.revokeObjectURL(state.selectedFileUrl);
            state.selectedFileUrl = "";
          }
        }

        function clearSelectedFile() {
          releaseSelectedFileUrl();
          state.selectedFile = null;
          elements.audioInput.value = "";
          elements.audioPreview.removeAttribute("src");
          elements.audioPreview.load();
          elements.selectedFile.hidden = true;
          elements.dropZone.hidden = false;
          elements.uploadProgress.hidden = true;
          updateProgress(0);
          updateControls();
        }

        function selectFile(file) {
          if (!file || state.isUploading) {
            return;
          }

          const extension = getExtension(file.name);
          if (!AUDIO_MIME_TYPES[extension]) {
            elements.audioInput.value = "";
            showToast("Unsupported file type. Please choose a supported audio file.", "error");
            return;
          }

          releaseSelectedFileUrl();
          state.selectedFile = file;
          state.selectedFileUrl = URL.createObjectURL(file);
          elements.selectedFileName.textContent = file.name;
          elements.selectedFileName.title = file.name;
          elements.selectedFileMeta.textContent = `${extension.slice(1).toUpperCase()} · ${formatBytes(file.size)}`;
          elements.audioPreview.src = state.selectedFileUrl;
          elements.dropZone.hidden = true;
          elements.selectedFile.hidden = false;
          elements.uploadProgress.hidden = true;
          updateProgress(0);
          updateControls();
        }

        function updateControls() {
          const waitingForSession = Boolean(state.selectedFile && !state.sessionId);
          elements.uploadButton.disabled =
            state.isUploading || state.isReconnecting || waitingForSession;
          elements.removeFileButton.disabled = state.isUploading;
          elements.audioInput.disabled = state.isUploading;
          elements.connectionButton.disabled = state.isUploading || state.isReconnecting;
          elements.dropZone.setAttribute("aria-disabled", String(state.isUploading));

          if (state.isUploading) {
            elements.uploadButtonLabel.textContent = "Uploading…";
          } else if (state.isReconnecting && state.selectedFile) {
            elements.uploadButtonLabel.textContent = "Waiting for service";
          } else if (state.selectedFile) {
            elements.uploadButtonLabel.textContent = state.sessionId
              ? "Start Transcription"
              : "Waiting for service";
          } else {
            elements.uploadButtonLabel.textContent = "Choose Audio File";
          }
        }

        function updateProgress(percent) {
          const value = Math.max(0, Math.min(100, Math.round(percent)));
          elements.progressBar.value = value;
          elements.progressValue.textContent = `${value}%`;
        }

        function normalizeUploadFile(file) {
          if (file.type && file.type.startsWith("audio/")) {
            return file;
          }
          const extension = getExtension(file.name);
          return new Blob([file], { type: AUDIO_MIME_TYPES[extension] });
        }

        function parseUploadError(xhr) {
          try {
            const body = xhr.response || JSON.parse(xhr.responseText);
            if (typeof body?.detail === "string") {
              return body.detail;
            }
            if (Array.isArray(body?.detail)) {
              const messages = body.detail
                .map((item) => (typeof item?.msg === "string" ? item.msg : ""))
                .filter(Boolean);
              if (messages.length) {
                return messages.join("; ");
              }
            }
          } catch {
            // Fall back to the status code for non-JSON error responses.
          }

          if (xhr.status === 413) {
            return "The file is too large for the service";
          }
          if (xhr.status === 415) {
            return "The service does not support this audio format";
          }
          return xhr.status
            ? `Upload failed (${xhr.status})`
            : "Upload failed. Check your network connection.";
        }

        function sendTaskUpload(file, sessionId) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", API.currentTask);
            xhr.setRequestHeader("session", sessionId);
            xhr.responseType = "json";

            xhr.upload.addEventListener("progress", (event) => {
              if (event.lengthComputable) {
                updateProgress((event.loaded / event.total) * 100);
              }
            });
            xhr.addEventListener("load", () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                updateProgress(100);
                resolve();
                return;
              }
              reject(createRequestError(parseUploadError(xhr), xhr.status));
            });
            xhr.addEventListener("error", () => {
              reject(createRequestError("Upload failed. Check your network connection."));
            });
            xhr.addEventListener("abort", () => {
              reject(createRequestError("Upload canceled"));
            });

            const formData = new FormData();
            formData.append("file", normalizeUploadFile(file), file.name);
            formData.append("model", DEFAULT_MODEL);
            xhr.send(formData);
          });
        }

        async function submitTask(file, allowSessionRetry = true) {
          const sessionId = await ensureSession();
          try {
            return await sendTaskUpload(file, sessionId);
          } catch (error) {
            if (error?.status === 404 && allowSessionRetry) {
              invalidateSession(sessionId);
              elements.progressLabel.textContent = "Session refreshed. Retrying upload";
              updateProgress(0);
              return submitTask(file, false);
            }
            throw error;
          }
        }

        async function uploadSelectedFile() {
          const file = state.selectedFile;
          if (!file || state.isUploading) {
            return;
          }

          state.isUploading = true;
          elements.uploadProgress.hidden = false;
          elements.progressLabel.textContent = "Uploading";
          updateProgress(0);
          updateControls();

          try {
            await submitTask(file);
          } catch (error) {
            if (!state.sessionId || !error?.status || error.status >= 500) {
              setConnectionStatus("offline");
            }
            elements.progressLabel.textContent = "Upload failed";
            showToast(getErrorMessage(error, "Upload failed. Please try again later."), "error");
            return;
          } finally {
            state.isUploading = false;
            updateControls();
          }

          showToast(`"${file.name}" was added to the transcription queue`);
          clearSelectedFile();
          await refreshAfterCurrentRequest();
        }

        function showDialog() {
          if (typeof elements.resultDialog.showModal === "function") {
            if (!elements.resultDialog.open) {
              elements.resultDialog.showModal();
            }
            return;
          }
          elements.resultDialog.setAttribute("open", "");
        }

        function abortResultPreview() {
          if (state.previewController) {
            state.previewController.abort();
            state.previewController = null;
          }
        }

        function closeDialog() {
          abortResultPreview();
          if (typeof elements.resultDialog.close === "function") {
            elements.resultDialog.close();
          } else {
            elements.resultDialog.removeAttribute("open");
          }
        }

        function getTranscriptText(data, segments) {
          const segmentText = segments
            .map((segment) => (typeof segment?.text === "string" ? segment.text : ""))
            .filter(Boolean)
            .join("")
            .trim();
          return segmentText || (typeof data?.text === "string" ? data.text.trim() : "");
        }

        function renderResultPreview(data) {
          const segments = Array.isArray(data?.segments) ? data.segments : [];
          const fullText = getTranscriptText(data, segments);

          state.previewText = fullText;
          elements.copyResultButton.disabled = !fullText;
          elements.dialogBody.replaceChildren();

          if (!fullText && !segments.length) {
            const raw = document.createElement("pre");
            raw.className = "raw-result";
            raw.textContent = JSON.stringify(data, null, 2);
            elements.dialogBody.append(raw);
            return;
          }

          if (fullText) {
            const overview = document.createElement("section");
            overview.className = "transcript-overview mb-6 p-4 sm:p-5";

            const label = document.createElement("span");
            label.className = "mb-3 block text-xs font-semibold tracking-wider text-base-content/45";
            label.textContent = "Full Transcript";

            const paragraph = document.createElement("p");
            paragraph.className = "mb-0 whitespace-pre-wrap text-sm leading-8 sm:text-base";
            paragraph.textContent = fullText;

            overview.append(label, paragraph);
            elements.dialogBody.append(overview);
          }

          if (segments.length) {
            const label = document.createElement("span");
            label.className = "mb-3 block text-xs font-semibold tracking-wider text-base-content/45";
            label.textContent = "Timeline Segments";

            const list = document.createElement("ol");
            list.className = "segment-list";
            segments.forEach((segment) => {
              const item = document.createElement("li");
              item.className = "segment-item";

              const time = document.createElement("span");
              time.className = "segment-time";
              time.textContent = `${formatTime(segment?.start)} — ${formatTime(segment?.end)}`;

              const text = document.createElement("p");
              text.className = "mb-0 text-sm leading-7";
              text.textContent = typeof segment?.text === "string" ? segment.text.trim() : "";

              item.append(time, text);
              list.append(item);
            });
            elements.dialogBody.append(label, list);
          }
        }

        function renderPreviewLoading() {
          const loading = document.createElement("div");
          loading.className = "grid min-h-64 place-items-center text-sm text-base-content/50";

          const content = document.createElement("div");
          content.className = "flex items-center gap-3";

          const spinner = document.createElement("span");
          spinner.className = "loading loading-spinner loading-md flex-none text-primary";
          content.append(spinner, document.createTextNode("Loading transcription result…"));
          loading.append(content);
          elements.dialogBody.replaceChildren(loading);
        }

        async function openResult(result) {
          abortResultPreview();
          const controller = new AbortController();
          state.previewController = controller;

          const visibleName = displayFilename(result.name);
          const baseMeta = `${formatBytes(result.size)} · ${formatDate(result.modified_at)}`;
          elements.dialogTitle.textContent = visibleName;
          elements.dialogMeta.textContent = baseMeta;
          elements.downloadResultLink.href = result.url;
          elements.downloadResultLink.download = visibleName;
          elements.copyResultButton.disabled = true;
          state.previewText = "";
          renderPreviewLoading();
          showDialog();

          try {
            const response = await fetch(result.url, {
              cache: "no-store",
              signal: controller.signal,
            });
            if (!response.ok) {
              throw createRequestError(`Failed to load result (${response.status})`, response.status);
            }

            const data = await response.json();
            if (state.previewController !== controller) {
              return;
            }

            renderResultPreview(data);
            const language = typeof data?.language === "string"
              ? data.language.toUpperCase()
              : "";
            const segmentCount = Array.isArray(data?.segments) ? data.segments.length : 0;
            elements.dialogMeta.textContent = [
              baseMeta,
              language ? `Language ${language}` : "",
              segmentCount ? `${segmentCount} ${segmentCount === 1 ? "segment" : "segments"}` : "",
            ].filter(Boolean).join(" · ");
          } catch (error) {
            if (error?.name === "AbortError" || state.previewController !== controller) {
              return;
            }
            elements.dialogBody.replaceChildren(
              createEmptyState(
                "Unable to preview this file",
                getErrorMessage(error, "Download the file to view it."),
                ICONS.warning,
              ),
            );
          } finally {
            if (state.previewController === controller) {
              state.previewController = null;
            }
          }
        }

        async function copyPreviewText() {
          if (!state.previewText) {
            return;
          }

          try {
            if (navigator.clipboard && window.isSecureContext) {
              await navigator.clipboard.writeText(state.previewText);
            } else {
              const textarea = document.createElement("textarea");
              textarea.value = state.previewText;
              textarea.setAttribute("readonly", "");
              textarea.style.position = "fixed";
              textarea.style.opacity = "0";
              document.body.append(textarea);
              textarea.select();
              const copied = document.execCommand("copy");
              textarea.remove();
              if (!copied) {
                throw new Error("Copy command failed");
              }
            }
            showToast("Text copied to clipboard");
          } catch {
            showToast("Copy failed. Please select and copy the text manually.", "error");
          }
        }

        async function reconnect() {
          if (state.isUploading || state.isReconnecting) {
            return;
          }

          state.isReconnecting = true;
          invalidateSession();
          try {
            await ensureSession();
            await refreshAfterCurrentRequest({ notify: true, reportError: true });
          } catch (error) {
            setConnectionStatus("offline");
            showToast(getErrorMessage(error, "Unable to connect to the service"), "error");
          } finally {
            state.isReconnecting = false;
            updateControls();
          }
        }

        function bindEvents() {
          let dragDepth = 0;

          elements.audioInput.addEventListener("change", (event) => {
            selectFile(event.currentTarget.files?.[0]);
          });
          elements.dropZone.addEventListener("keydown", (event) => {
            if (!state.isUploading && (event.key === "Enter" || event.key === " ")) {
              event.preventDefault();
              elements.audioInput.click();
            }
          });
          elements.dropZone.addEventListener("dragenter", (event) => {
            event.preventDefault();
            if (state.isUploading) {
              return;
            }
            dragDepth += 1;
            elements.dropZone.classList.add("is-dragging");
          });
          elements.dropZone.addEventListener("dragover", (event) => {
            event.preventDefault();
          });
          elements.dropZone.addEventListener("dragleave", (event) => {
            event.preventDefault();
            dragDepth = Math.max(0, dragDepth - 1);
            if (!dragDepth) {
              elements.dropZone.classList.remove("is-dragging");
            }
          });
          elements.dropZone.addEventListener("drop", (event) => {
            event.preventDefault();
            dragDepth = 0;
            elements.dropZone.classList.remove("is-dragging");
            selectFile(event.dataTransfer?.files?.[0]);
          });

          elements.removeFileButton.addEventListener("click", clearSelectedFile);
          elements.uploadButton.addEventListener("click", () => {
            if (state.selectedFile) {
              void uploadSelectedFile();
            } else {
              elements.audioInput.click();
            }
          });
          elements.connectionButton.addEventListener("click", () => {
            void reconnect();
          });
          elements.closeDialogButton.addEventListener("click", closeDialog);
          elements.resultDialog.addEventListener("close", abortResultPreview);
          elements.copyResultButton.addEventListener("click", () => {
            void copyPreviewText();
          });

          document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
              clearPollingTimer();
              return;
            }
            void refreshData();
          });
          window.addEventListener("beforeunload", () => {
            clearPollingTimer();
            releaseSelectedFileUrl();
            abortResultPreview();
          });
        }

        async function initialize() {
          bindEvents();
          renderSkeleton(elements.queueContent, 2);
          renderSkeleton(elements.resultsContent, 3);
          setConnectionStatus("connecting");
          updateControls();

          try {
            await ensureSession();
            await refreshData({ reportError: true });
          } catch (error) {
            setConnectionStatus("offline");
            renderTasks();
            renderResults();
            showToast(
              getErrorMessage(error, "Unable to connect to the service. Make sure it is running."),
              "error",
            );
          }

        }

        void initialize();
      })();
    </script>
  </body>
</html>
